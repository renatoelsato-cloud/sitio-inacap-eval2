{% extends "malla/base.html" %}
{% block principal %}
<div class="container my-4" style="max-width: 600px;">
    <h3 class="mb-3">Eliminar estudiante</h3>
    <p>¿Seguro que quieres eliminar a <strong>{{ estudiante.nombre }}</strong> ({{ estudiante.rut }})? También se borrarán sus notas.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'estudiante_listado' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
