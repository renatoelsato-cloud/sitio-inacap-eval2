{% extends 'egreso/base.html' %}

{% block principal %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Competencias del Perfil de Egreso</h1>
    </div>

    <form class="d-flex mb-3" role="search">
        <input class="form-control me-2" type="search" placeholder="Buscar competencia...">
        <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-search"></i> Buscar</button>
    </form>

    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for competencia in competencias %}
            <tr>
                <td>{{ competencia.nombre }}</td>
                <td>{{ competencia.descripcion }}</td>
                <td>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
