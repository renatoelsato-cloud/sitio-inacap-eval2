{% extends 'egreso/base.html' %}

{% block principal %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Notas de Estudiantes</h1>
        <a href="#" class="btn btn-success"><i class="bi bi-plus-lg"></i> Agregar Nota</a>
    </div>

    <form class="d-flex mb-3" role="search">
        <input class="form-control me-2" type="search" placeholder="Buscar estudiante...">
        <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-search"></i> Buscar</button>
    </form>

    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Estudiante</th>
                <th>Asignatura</th>
                <th>Calificación</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for nota in notas %}
            <tr>
                <td>{{ nota.estudiante.nombre }}</td>
                <td>{{ nota.asignatura.nombre }}</td>
                <td>{{ nota.calificacion }}</td>
                <td>
                    <a href="#" class="text-warning me-2"><i class="bi bi-pencil-square"></i></a>
                    <a href="#" class="text-danger"><i class="bi bi-trash"></i></a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
